version: "1.0"
features:
  # Shared implementation patches retain claims from each contributing feature.
  # Primary maintenance: browseros-core owns core/theme/action identifiers;
  # api owns extension API/IDL/histograms; vertical-tabs owns the strip region;
  # ai-section owns its view; rail-glyph owns collapsed-tab/hover presentation;
  # ai-panel owns its panel; native-batch-b owns grid and product-mark resources.
  # The patch pipeline applies each path once, independently of claim count.
  # ── LAYER 0: BUILD-OWNED OUTPUTS ─────────────────────────

  build-resources:
    store: false
    description: "resource: bos_build outputs"
    files:
      - chrome/BROWSEROS_VERSION
      - chrome/VERSION
      - chrome/app/chromium_strings.grd
      - chrome/app/settings_chromium_strings.grdp
      - chrome/app/theme/chromium/
      - chrome/app/theme/default_100_percent/chromium/
      - chrome/app/theme/default_200_percent/chromium/
      - chrome/browser/browseros/claw_server/resources/
      - chrome/browser/browseros/server/resources/
      - chrome/browser/browseros/onboarding/resources/
      - chrome/enterprise_companion/branding.gni
      - chrome/updater/branding.gni

  # ── LAYER 1: CORE & BRANDING ──────────────────────────────
  # Foundation patches applied first. Shared files (3+ features)
  # live here so later features don't duplicate them.

  browseros-core:
    description: "chore: browseros core infrastructure"
    files:
      # Directory structure + core constants/prefs/switches + product identity
      - chrome/browser/browseros/BUILD.gn
      - chrome/browser/browseros/buildflags.gni
      - chrome/browser/browseros/core/
      # Shared pref infrastructure (metrics + importer)
      - chrome/browser/prefs/browser_prefs.cc
      - chrome/browser/prefs/browser_prefs.h
      - chrome/browser/prefs/BUILD.gn
      - chrome/common/pref_names.h
      # Shared command/action registrations (llm-chat + pin-ext + agent-v2)
      - chrome/app/chrome_command_ids.h
      - chrome/browser/ui/actions/chrome_action_id.h
      - chrome/browser/ui/browser_command_controller.cc
      # Shared toolbar pref (llm-chat + pin-chat + disable-chrome-labs)
      - chrome/browser/ui/toolbar/toolbar_pref_names.cc
      # Shared pinned button (pin-chat)
      - chrome/browser/ui/views/toolbar/pinned_action_toolbar_button.cc

      # Chromium 155 moved the former browser.cc customizations here.
      - "chrome/browser/ui/browser_web_contents_delegate/browser_web_contents_delegate.cc"
      - "chrome/browser/ui/bookmarks/bookmark_bar_controller.cc"
      - "chrome/browser/ui/browser_web_contents_delegate/BUILD.gn"
      - "chrome/browser/ui/bookmarks/BUILD.gn"
  branding:
    description: "chore: browseros branding and identity"
    files:
      # Generated branding outputs are owned by bos_build overlays/resources;
      # list paths here only when a chromium_patches patch exists on disk.
      # Version info
      - base/version_info/BUILD.gn
      - base/version_info/version_info.h
      - base/version_info/version_info_values.h.version
      # Branding file paths
      - chrome/common/chrome_constants.cc
      - chrome/common/chrome_paths.cc
      - chrome/common/chrome_paths.h
      - chrome/common/chrome_paths_linux.cc
      - chrome/install_static/chromium_install_modes.h
      # About page (version + branding display)
      - chrome/browser/resources/settings/about_page/about_page.ts
      - chrome/browser/resources/settings/about_page/about_page.html.ts
      - chrome/browser/resources/settings/about_page/about_page.css
      - chrome/browser/ui/webui/settings/settings_localized_strings_provider.cc
      # Dock icon variants
      - chrome/browser/chrome_browser_application_mac.mm
      - chrome/browser/ui/cocoa/dock_icon.h
      - chrome/browser/ui/cocoa/dock_icon.mm
      # Custom vector icons
      - components/vector_icons/BUILD.gn
      - components/vector_icons/chat_orange.icon

  browserclaw-product-dir:
    description: "feat: per-product user-data dir via browseros_product buildflag"
    files:
      # Buildflag deps for the per-product profile roots; the identity
      # values themselves live in files claimed by browseros-core,
      # branding, and managed-browser-updater
      - chrome/common/BUILD.gn
      - chrome/install_static/BUILD.gn

  # ── LAYER 2: PLATFORM PATCHES ─────────────────────────────

  windows-patches:
    description: "series: windows platform patches"
    files:
      - build/build_config.h
      - build/toolchain/win/tool_wrapper.py
      - chrome/app/chrome_dll.rc
      - chrome/app/chrome_exe.rc
      - chrome/browser/web_applications/chrome_pwa_launcher/chrome_pwa_launcher_exe.rc
      - chrome/installer/setup/setup.rc
      - components/download/internal/common/download_item_impl.cc

  crash-reporter:
    description: "fix: crash reporter branding"
    files:
      - chrome/app/chrome_crash_reporter_client.cc
      - chrome/app/chrome_crash_reporter_client.h
      - chrome/app/chrome_crash_reporter_client_win.cc
      - chrome/app/chrome_crash_reporter_client_win.h

  # ── LAYER 3: INFRASTRUCTURE SERVICES ──────────────────────

  managed-browser-updater:
    description: "feat: delegate native browser updates to Windrise Bridge"
    files:
